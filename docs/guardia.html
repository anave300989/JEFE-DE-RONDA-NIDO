<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Control de Guardia</title>
<link rel="stylesheet" href="app.css">
<style>
  .turnos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .turno { padding: 14px 8px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: var(--txt); font-weight: 700; }
  .turno small { display: block; font-weight: 400; color: var(--muted); }
  .turno.actual { border-color: var(--pri); background: #eef3e8; }
  .turno.sel { background: var(--pri); color: var(--pri-txt); }
  .turno.sel small { color: var(--pri-txt); }
  .lugares { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lugar { border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; background: var(--card); }
  .lugar b { display: block; margin-bottom: 4px; }
  .lugar .n { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .lugar label { margin: 0; display: block; color: var(--pri-txt); background: var(--pri); border-radius: 8px; padding: 10px 6px; font-weight: 600; cursor: pointer; }
  .lugar input { display: none; }
  .lugar.solo label { display: none; }
</style>
</head>
<body>
<header>
  <h1>Control de Guardia</h1>
  <p>Escuela de Cóndores Bolivianos</p>
</header>
<main>
  <div id="msg" class="msg hidden"></div>

  <section id="vPin" class="card hidden">
    <h2>Ingreso</h2>
    <label for="pin">PIN personal</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <p></p>
    <button id="btnPin" class="full">Ingresar</button>
  </section>

  <div id="vGuardia" class="hidden">
    <div class="card">
      <h2 id="cargo"></h2>
      <p id="datos" style="margin:0"></p>
    </div>
    <div id="pendientes" class="msg hidden"></div>
    <div class="card">
      <h2>Turno</h2>
      <div class="turnos" id="turnos"></div>
    </div>
    <div class="card hidden" id="vLugares">
      <h2 id="tituloTurno"></h2>
      <p id="notaTurno" style="font-size:14px;color:var(--muted);margin-top:0"></p>
      <div class="lugares" id="lugares"></div>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
const token = new URLSearchParams(location.search).get('t');
const msg = $('#msg');
const PIN_GUARDADO = 'gpin_' + token;
let pin = '', g = null, desfase = 0, turnoSel = null;

// Fotos que aún no llegaron al sistema (por ejemplo, sin señal). Se guardan en el celular y se reenvían.
const cola = {
  db: null,
  abrir() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((ok, mal) => {
      const r = indexedDB.open('guardia', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('pendientes', { autoIncrement: true });
      r.onsuccess = () => ok(this.db = r.result);
      r.onerror = () => mal(r.error);
    });
  },
  async poner(v) { const db = await this.abrir(); return new Promise(ok => { const r = db.transaction('pendientes', 'readwrite').objectStore('pendientes').add(v); r.onsuccess = () => ok(r.result); }); },
  async quitar(k) { const db = await this.abrir(); db.transaction('pendientes', 'readwrite').objectStore('pendientes').delete(k); },
  async todas() {
    const db = await this.abrir();
    return new Promise(ok => {
      const out = [], r = db.transaction('pendientes').objectStore('pendientes').openCursor();
      r.onsuccess = () => { const c = r.result; if (c) { if (c.value.token === token) out.push({ k: c.key, v: c.value }); c.continue(); } else ok(out); };
    });
  }
};

if (!token) aviso(msg, 'Enlace no válido. Use el enlace que recibió por WhatsApp.', 'err');
else {
  let guardado = '';
  try { guardado = localStorage.getItem(PIN_GUARDADO) || ''; } catch (e) {}
  if (guardado) entrar(guardado, true); else $('#vPin').classList.remove('hidden');
}
$('#btnPin').onclick = () => entrar($('#pin').value.trim(), false);

async function entrar(p, automatico) {
  pin = p;
  $('#btnPin').disabled = true;
  try {
    g = await api('guardiaAbrir', { token, pin });
    try { localStorage.setItem(PIN_GUARDADO, pin); } catch (e) {}
    desfase = g.ahora - Date.now();
    $('#cargo').textContent = g.cargo;
    $('#datos').innerHTML = '<b>' + esc(g.grado_nombre) + '</b><br>Guardia del ' + esc(fechaLarga(g.fecha)) + ' (07:00 a 07:00)';
    $('#vPin').classList.add('hidden'); msg.classList.add('hidden');
    $('#vGuardia').classList.remove('hidden');
    if (g.terminada) aviso(msg, 'Esta guardia ya terminó. Solo puede ver lo registrado.', 'ok');
    else if (!g.turnoActual) aviso(msg, 'Su guardia todavía no empezó. Empieza a las 07:00 del ' + fechaLarga(g.fecha) + '.');
    pintarTurnos();
    if (g.turnoActual) elegirTurno(g.turnoActual);
    enviarPendientes();
  } catch (e) {
    if (automatico) { try { localStorage.removeItem(PIN_GUARDADO); } catch (x) {} $('#vPin').classList.remove('hidden'); }
    aviso(msg, e.message, 'err');
  }
  $('#btnPin').disabled = false;
}

// Hora de Bolivia según el reloj del sistema (no el del celular).
function partesBolivia(ms) {
  const o = {};
  new Intl.DateTimeFormat('en-CA', { timeZone: 'America/La_Paz', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date(ms)).forEach(x => o[x.type] = x.value);
  return o;
}
function turnoAhora() {
  const ms = Date.now() + desfase, h = +partesBolivia(ms).hour;
  const p = partesBolivia(h < 7 ? ms - 12 * 3600 * 1000 : ms);
  const fecha = p.year + '-' + p.month + '-' + p.day;
  const t = h >= 7 && h < 13 ? 'MANANA' : h >= 13 && h < 19 ? 'TARDE' : (h >= 19 || h < 1) ? 'NOCHE' : 'MADRUGADA';
  return fecha === g.fecha ? t : null;
}

function fotos(n) { return n + (n === 1 ? ' foto' : ' fotos'); }
function fechaLarga(f) { return f.split('-').reverse().join('/'); }
function totalTurno(t) { const c = g.conteo[t] || {}; return Object.values(c).reduce((a, b) => a + b, 0); }

function pintarTurnos() {
  $('#turnos').innerHTML = g.turnos.map(t => '<button class="turno' + (t.id === g.turnoActual ? ' actual' : '') + (t.id === turnoSel ? ' sel' : '') +
    '" data-t="' + t.id + '">' + esc(t.nombre) + '<small>' + esc(t.horario) + '</small><small>' + fotos(totalTurno(t.id)) + '</small></button>').join('');
  document.querySelectorAll('.turno').forEach(b => b.onclick = () => elegirTurno(b.dataset.t));
}

function elegirTurno(t) {
  turnoSel = t;
  g.turnoActual = turnoAhora();
  const info = g.turnos.find(x => x.id === t), activo = t === g.turnoActual;
  $('#tituloTurno').textContent = 'Turno ' + info.nombre + ' (' + info.horario + ')';
  $('#notaTurno').textContent = activo ? 'Toque "Tomar foto" en cada lugar. Puede tomar varias fotos por lugar.'
    : 'Este turno no está habilitado ahora. Solo se pueden tomar fotos en el turno de la hora actual.';
  $('#lugares').innerHTML = g.lugares.map((l, i) => '<div class="lugar' + (activo ? '' : ' solo') + '"><b>' + esc(l) + '</b>' +
    '<div class="n" id="n' + i + '">' + fotos((g.conteo[t] || {})[l] || 0) + '</div>' +
    '<label>📷 Tomar foto<input type="file" accept="image/*" capture="environment" data-l="' + i + '"></label></div>').join('');
  document.querySelectorAll('#lugares input').forEach(inp => inp.onchange = () => tomarFoto(inp));
  $('#vLugares').classList.remove('hidden');
  pintarTurnos();
}

function tomarFoto(inp) {
  const f = inp.files[0], lugar = g.lugares[+inp.dataset.l], turno = turnoSel;
  inp.value = '';
  if (!f) return;
  const tomada = Date.now() + desfase;
  const img = new Image();
  img.onload = async () => {
    const max = 1280, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    // Sello con fecha y hora del sistema, lugar y turno.
    const d = partesBolivia(tomada);
    const sello = d.day + '/' + d.month + '/' + d.year + ' ' + d.hour + ':' + d.minute + ':' + d.second +
      ' · ' + lugar + ' · ' + g.turnos.find(x => x.id === turno).nombre;
    const fs = Math.max(16, Math.round(c.width / 32));
    ctx.font = 'bold ' + fs + 'px sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, c.height - fs * 1.8, c.width, fs * 1.8);
    ctx.fillStyle = '#fff'; ctx.fillText(sello, fs * 0.5, c.height - fs * 0.6);
    const foto = c.toDataURL('image/jpeg', 0.7);
    await cola.poner({ token, turno, lugar, tomada, foto });
    enviarPendientes();
  };
  img.src = URL.createObjectURL(f);
}

let enviando = false;
async function enviarPendientes() {
  if (enviando) return;
  enviando = true;
  try {
    for (const p of await cola.todas()) {
      mostrarPendientes();
      try {
        const r = await api('guardiaFoto', { token, pin, turno: p.v.turno, lugar: p.v.lugar, tomada: p.v.tomada, foto: p.v.foto });
        await cola.quitar(p.k);
        g.conteo = r.conteo;
        aviso(msg, 'Foto guardada: ' + p.v.lugar + ' · ' + r.hora.slice(11), 'ok');
      } catch (e) {
        if (/no corresponde|no es válida|Lugar|Imagen/.test(e.message)) { await cola.quitar(p.k); aviso(msg, 'Foto rechazada: ' + e.message, 'err'); }
        else { aviso(msg, 'Sin conexión. La foto quedó guardada en el celular y se enviará sola.', 'err'); break; }
      }
    }
  } finally {
    enviando = false;
    await mostrarPendientes();
    if (turnoSel) elegirTurno(turnoSel);
  }
}

async function mostrarPendientes() {
  const n = (await cola.todas()).length, el = $('#pendientes');
  if (!n) return el.classList.add('hidden');
  el.innerHTML = 'Fotos por enviar: <b>' + n + '</b> <button class="sec" id="btnReintentar" style="padding:6px 10px">Reintentar</button>';
  el.classList.remove('hidden');
  $('#btnReintentar').onclick = enviarPendientes;
}
setInterval(() => {
  if (!g) return;
  if (navigator.onLine) enviarPendientes();
  else if (turnoSel) elegirTurno(turnoSel);
}, 60000);
window.addEventListener('online', () => { if (g) enviarPendientes(); });
</script>
</body>
</html>
